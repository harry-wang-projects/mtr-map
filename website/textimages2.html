<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoundBox Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .controls-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(0, 0, 0, 0.5);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.3rem;
        }

        input[type="color"] {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: none;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .range-value {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #e94560;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .image-label {
            font-size: 0.85rem;
            color: #a0a0a0;
            word-break: break-all;
            text-align: center;
            max-width: 100%;
        }

        .canvas-container {
            background:
                linear-gradient(45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a4a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a4a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #1a1a2e;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .canvas-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(233, 69, 96, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            max-width: 100%;
        }

        canvas:hover {
            transform: scale(1.02);
        }

        .card-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
        }

        .output-area {
            width: 100%;
            max-width: 600px;
        }

        textarea.output {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        .presets {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .preset-btn {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        .preset-btn:hover {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        .bulk-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 3rem;
            font-size: 1.1rem;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .controls-panel {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 RoundBox Image Generator</h1>

        <div class="controls-panel">
            <div class="control-group">
                <label>Text Content (one per line or comma-separated)</label>
                <textarea id="textInput" placeholder="Hello&#10;World&#10;Foo, Bar">Hello&#10;World&#10;Foo, Bar</textarea>
                <div class="hint">Enter multiple strings, one per line. Leading/trailing spaces are preserved.</div>
            </div>

            <div class="control-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#e94560">
                <div class="presets">
                    <button class="preset-btn" onclick="setColor('#e94560')">Coral</button>
                    <button class="preset-btn" onclick="setColor('#0f3460')">Navy</button>
                    <button class="preset-btn" onclick="setColor('#533483')">Purple</button>
                    <button class="preset-btn" onclick="setColor('#f39422')">Orange</button>
                    <button class="preset-btn" onclick="setColor('#16c79a')">Teal</button>
                </div>
            </div>

            <div class="control-group">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="control-group">
                <label>Corner Radius</label>
                <div class="range-container">
                    <input type="range" id="cornerRadius" min="0" max="100" value="20">
                    <span class="range-value" id="radiusValue">20px</span>
                </div>
            </div>

            <div class="control-group">
                <label>Font Size</label>
                <div class="range-container">
                    <input type="range" id="fontSize" min="20" max="120" value="48">
                    <span class="range-value" id="fontValue">48px</span>
                </div>
            </div>

            <div class="control-group">
                <label>Padding</label>
                <div class="range-container">
                    <input type="range" id="padding" min="10" max="100" value="30">
                    <span class="range-value" id="paddingValue">30px</span>
                </div>
            </div>

            <div class="control-group">
                <label>Font Weight</label>
                <select id="fontWeight">
                    <option value="normal">Normal</option>
                    <option value="bold" selected>Bold</option>
                    <option value="900">Black</option>
                </select>
            </div>

            <div class="control-group">
                <label>Shadow Intensity</label>
                <div class="range-container">
                    <input type="range" id="shadowIntensity" min="0" max="50" value="20">
                    <span class="range-value" id="shadowValue">20</span>
                </div>
            </div>
        </div>

        <div class="preview-area">
            <div class="bulk-actions">
                <button class="btn-primary" onclick="downloadAllPNG()">📥 Download All PNGs</button>
                <button class="btn-secondary" onclick="copyAllBase64()">📋 Copy All Base64</button>
            </div>

            <div class="images-grid" id="imagesGrid">
                <!-- Images will be generated here -->
            </div>

            <div class="output-area" id="outputArea" style="display: none;">
                <label>Base64 Data URL</label>
                <textarea class="output" id="base64Output" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // Input elements
        const inputs = {
            text: document.getElementById('textInput'),
            bgColor: document.getElementById('bgColor'),
            textColor: document.getElementById('textColor'),
            cornerRadius: document.getElementById('cornerRadius'),
            fontSize: document.getElementById('fontSize'),
            padding: document.getElementById('padding'),
            fontWeight: document.getElementById('fontWeight'),
            shadowIntensity: document.getElementById('shadowIntensity')
        };

        // Value displays
        const displays = {
            radius: document.getElementById('radiusValue'),
            font: document.getElementById('fontValue'),
            padding: document.getElementById('paddingValue'),
            shadow: document.getElementById('shadowValue')
        };

        const imagesGrid = document.getElementById('imagesGrid');

        function updateDisplay(input, display, suffix = 'px') {
            displays[display].textContent = input.value + suffix;
        }

        // Add event listeners
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', () => {
                if (key === 'cornerRadius') updateDisplay(inputs[key], 'radius');
                if (key === 'fontSize') updateDisplay(inputs[key], 'font');
                if (key === 'padding') updateDisplay(inputs[key], 'padding');
                if (key === 'shadowIntensity') updateDisplay(inputs[key], 'shadow', '');
                drawAll();
            });
        });

        function setColor(color) {
            inputs.bgColor.value = color;
            drawAll();
        }

        function parseTexts() {
            const raw = inputs.text.value;
            // Split only by newlines, preserve leading/trailing spaces
            const lines = raw.split('\n');
            const texts = [];
            for (const line of lines) {
                // Keep the line as-is (spaces preserved), but skip completely empty lines
                if (line.length > 0) {
                    texts.push(line);
                }
            }
            return texts.length > 0 ? texts : [' '];
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawOnCanvas(canvas, text) {
            const ctx = canvas.getContext('2d');
            const padding = parseInt(inputs.padding.value);
            const fontSize = parseInt(inputs.fontSize.value);
            const radius = parseInt(inputs.cornerRadius.value);
            const shadowBlur = parseInt(inputs.shadowIntensity.value);

            // Set font to measure text
            ctx.font = `${inputs.fontWeight.value} ${fontSize}px "Segoe UI", sans-serif`;

            // Measure text
            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;
            const textHeight = fontSize;

            // Calculate canvas size
            const width = textWidth + (padding * 2);
            const height = textHeight + (padding * 1.5);

            // Set canvas size with high DPI support
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw shadow
            if (shadowBlur > 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = shadowBlur;
                ctx.shadowOffsetY = shadowBlur / 3;
                roundRect(ctx, 0, 0, width, height, radius);
                ctx.fillStyle = inputs.bgColor.value;
                ctx.fill();
                ctx.restore();
            }

            // Draw rounded rectangle
            roundRect(ctx, 0, 0, width, height, radius);
            ctx.fillStyle = inputs.bgColor.value;
            ctx.fill();

            // Draw text
            ctx.fillStyle = inputs.textColor.value;
            ctx.font = `${inputs.fontWeight.value} ${fontSize}px "Segoe UI", sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(text, width / 2, height / 2);
        }

        function drawAll() {
            const texts = parseTexts();
            imagesGrid.innerHTML = '';

            if (texts.length === 0) {
                imagesGrid.innerHTML = '<div class="empty-state">Enter some text to generate images</div>';
                return;
            }

            texts.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';

                const label = document.createElement('div');
                label.className = 'image-label';
                label.textContent = text;
                card.appendChild(label);

                const container = document.createElement('div');
                container.className = 'canvas-container';
                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${index}`;
                container.appendChild(canvas);
                card.appendChild(container);

                const buttons = document.createElement('div');
                buttons.className = 'card-buttons';

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'btn-primary btn-small';
                downloadBtn.textContent = '📥 PNG';
                downloadBtn.onclick = () => downloadSinglePNG(canvas, text);
                buttons.appendChild(downloadBtn);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn-secondary btn-small';
                copyBtn.textContent = '📋 Base64';
                copyBtn.onclick = () => copySingleBase64(copyBtn, canvas);
                buttons.appendChild(copyBtn);

                const showBtn = document.createElement('button');
                showBtn.className = 'btn-secondary btn-small';
                showBtn.textContent = '👁️ Show';
                showBtn.onclick = () => showSingleBase64(canvas);
                buttons.appendChild(showBtn);

                card.appendChild(buttons);
                imagesGrid.appendChild(card);

                drawOnCanvas(canvas, text);
            });
        }

        function downloadSinglePNG(canvas, text) {
            const safeName = text.replace(/[^a-z0-9]/gi, '_').substring(0, 30);
            const link = document.createElement('a');
            link.download = `roundbox-${safeName}-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAllPNG() {
            const canvases = imagesGrid.querySelectorAll('canvas');
            canvases.forEach((canvas, index) => {
                setTimeout(() => {
                    const text = parseTexts()[index] || `image-${index}`;
                    downloadSinglePNG(canvas, text);
                }, index * 200);
            });
        }

        function copySingleBase64(btn, canvas) {
            const base64 = canvas.toDataURL('image/png');
            navigator.clipboard.writeText(base64).then(() => {
                const original = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = original, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                btn.textContent = '❌ Failed';
                setTimeout(() => btn.textContent = '📋 Base64', 2000);
            });
        }

        function copyAllBase64() {
            const canvases = imagesGrid.querySelectorAll('canvas');
            const texts = parseTexts();
            let allBase64 = '';
            canvases.forEach((canvas, index) => {
                const text = texts[index] || `image-${index}`;
                allBase64 += `/* ${text} */\n${canvas.toDataURL('image/png')}\n\n`;
            });
            navigator.clipboard.writeText(allBase64).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅ All Copied!';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        function showSingleBase64(canvas) {
            const outputArea = document.getElementById('outputArea');
            const output = document.getElementById('base64Output');
            output.value = canvas.toDataURL('image/png');
            outputArea.style.display = 'block';
            outputArea.scrollIntoView({ behavior: 'smooth' });
        }

        // Initial draw
        drawAll();
    </script>
</body>
</html>
